name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: make verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install boto3 pyyaml cfn-lint aws-sam-cli
      # One command, the same one a contributor runs. If it is green here it is
      # green locally, and the other way round.
      - name: make verify
        run: make verify
